[global/wm]
include-file = ./colors.ini
include-file = ./modules.ini

[bar/top]
monitor = ${env:MONITOR:eDP-1}
width = 98%
height = 30
offset-x = 1%
offset-y = 0.5%
fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}
border-top-size = 7
border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
padding-left = 1
padding-right = 1
module-margin = 0
line-size = 3
wm-restack = bspwm
enable-ipc = true

modules-left = filesystem round-left bspwm round-right
modules-center = ${env:BAR_MODULES_CENTER:memory space cpu}
modules-right = ${env:BAR_MODULES_RIGHT:volume xkeyboard round-left time round-right space network-status space powermenu}

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=18;5
font-2 = Material Design Icons:style=Bold:size=13;3
font-3 = unifont:fontformat=truetype:size=13:antialias=true;3
font-4 = JetBrainsMono Nerd Font:style=Bold:pixelsize=20;4

; The X11 session permits one tray owner, always on the primary monitor.
[bar/top-primary]
inherit = bar/top
modules-right = ${env:BAR_MODULES_RIGHT:volume xkeyboard round-left time round-right space network-status space powermenu} tray
